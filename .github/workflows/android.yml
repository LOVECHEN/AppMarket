name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
      KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Signing Secrets
        run: |
          for name in SIGNING_KEY KEYSTORE_PASS KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

      - name: Decode Signing Key
        run: printf '%s' "$SIGNING_KEY" | base64 -d > keystore.jks

      - name: Build Release APK
        run: |
          ./gradlew :app:android:assembleRelease
          echo "APK_FILE=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)" >> $GITHUB_ENV

      - name: Verify LOVE Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          EXPECTED_SHA256="4a0dec98b20b25b885f694338d5a35b55dc8e179d40fe84afbfe98330001a218"
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE" 2>&1)
          printf '%s\n' "$CERT_OUTPUT"
          NORMALIZED_CERT_OUTPUT=$(printf '%s' "$CERT_OUTPUT" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [[ "$NORMALIZED_CERT_OUTPUT" != *"$EXPECTED_SHA256"* ]]; then
            echo "::error::APK is not signed by the expected LOVE certificate"
            exit 1
          fi
          echo "Verified LOVE signing certificate: $EXPECTED_SHA256"

      - name: Publish Rolling Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-latest
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest CI Build" \
              --notes "Rolling prerelease built and signed by GitHub Actions."
          fi

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
